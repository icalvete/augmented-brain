name: install

# The installer from nothing, on a clean macOS and a clean Ubuntu: what a newcomer gets
# with one command. The visual part (the desktop app's window, signing in, the
# interview) still needs a person; see scripts/install-check.sh.

on:
  push:            # any branch: a branch is how a change gets tried before main
    paths: [install.sh, scripts/install-check.sh, scripts/install-check-mac.sh, plugin/**, cmd/**, internal/**, go.mod, go.sum, .github/workflows/install.yml]
  workflow_dispatch:

permissions:
  contents: read

# macOS runners are few, and a push to a pull request's branch starts several Mac jobs
# at once (ci on push and on pull_request, install's Mac rows): some waited so long
# they were cancelled. A newer push to the same branch or pull request makes an older
# run of this workflow moot, so it is stopped (cancel-in-progress) instead of holding
# runners; a run on main is never stopped, so every commit of main keeps its result.
# The group tells events apart, so a push never stops a pull_request run (or the
# other way round): every check still runs on the last commit. Nothing is skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install:
    strategy:
      fail-fast: false
      # Two rows at a time: three of the four are Macs, and with ci's Mac jobs they
      # were more than the Mac runners could take at once. Every row still runs, the
      # last ones when the first are done.
      max-parallel: 2
      matrix:
        include:
          - os: macos-latest
            shell: /bin/zsh   # the default shell on a Mac
          - os: macos-latest  # most Macs have no Homebrew: the app comes from Anthropic's feed
            shell: /bin/zsh
            nobrew: "1"
          - os: macos-15-intel  # Intel Macs: the darwin_amd64 build and the Intel app
            shell: /bin/zsh
            nobrew: "1"
          - os: ubuntu-latest
            shell: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install from nothing and check
        env:
          SHELL: ${{ matrix.shell }}
          AB_CHECK_DESKTOP: "1"   # Homebrew or the feed on macOS, Anthropic's apt repository on Ubuntu
          AB_CHECK_NO_BREW: ${{ matrix.nobrew }}
        run: scripts/install-check.sh
      - name: What only a Mac can get wrong (PATH file, macOS version, Apple's git)
        if: runner.os == 'macOS'
        run: scripts/install-check-mac.sh
