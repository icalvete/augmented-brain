name: install

# The installer from nothing, on a clean macOS and a clean Ubuntu: what a newcomer gets
# with one command. The visual part (the desktop app's window, signing in, the
# interview) still needs a person; see scripts/install-check.sh.

# Once per change that touches what it covers: in its pull request, and again on main.
on:
  push:
    branches: [main]
    paths: [install.sh, scripts/install-check.sh, scripts/install-check-mac.sh, plugin/**, cmd/**, internal/**, go.mod, go.sum, .github/workflows/install.yml]
  pull_request:
    paths: [install.sh, scripts/install-check.sh, scripts/install-check-mac.sh, plugin/**, cmd/**, internal/**, go.mod, go.sum, .github/workflows/install.yml]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request stops an older run (it would hold the few macOS
# runners), except on main, where every commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install:
    timeout-minutes: 10   # a stuck runner fails here instead of waiting six hours
    strategy:
      fail-fast: false
      # Two Macs, side by side. The Intel Mac and Ubuntu are jobs of their own: neither
      # waits for these.
      matrix:
        include:
          - os: macos-latest
            shell: /bin/zsh   # the default shell on a Mac
          - os: macos-latest  # most Macs have no Homebrew: the app comes from Anthropic's feed
            shell: /bin/zsh
            nobrew: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install from nothing and check
        env:
          SHELL: ${{ matrix.shell }}
          AB_CHECK_DESKTOP: "1"   # Homebrew or the feed on macOS, Anthropic's apt repository on Ubuntu
          AB_CHECK_NO_BREW: ${{ matrix.nobrew }}
        run: scripts/install-check.sh
      - name: What only a Mac can get wrong (PATH file, macOS version, Apple's git)
        if: runner.os == 'macOS'
        run: scripts/install-check-mac.sh

  install-linux:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install from nothing and check
        env:
          SHELL: /bin/bash
          AB_CHECK_DESKTOP: "1"   # Anthropic's apt repository on Ubuntu
        run: scripts/install-check.sh

  # Intel Macs (the darwin_amd64 build and the Intel app): only on main and by hand, not
  # in every pull request. It took 3 more minutes there, waiting for a free Mac, and
  # what only an Intel Mac gets wrong is rare; a slip shows on main and is fixed there.
  install-mac-intel:
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install from nothing and check
        env:
          SHELL: /bin/zsh
          AB_CHECK_DESKTOP: "1"
          AB_CHECK_NO_BREW: "1"
        run: scripts/install-check.sh
      - name: What only a Mac can get wrong (PATH file, macOS version, Apple's git)
        run: scripts/install-check-mac.sh
