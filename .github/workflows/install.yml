name: install

# The installer from nothing, on a clean macOS and a clean Ubuntu: what a newcomer gets
# with one command. The visual part (the desktop app's window, signing in, the
# interview) still needs a person; see scripts/install-check.sh.

# Once per change that touches what it covers: in its pull request, and again on main.
on:
  push:
    branches: [main]
    paths: [install.sh, scripts/install-check.sh, scripts/install-check-mac.sh, plugin/**, cmd/**, internal/**, go.mod, go.sum, .github/workflows/install.yml]
  pull_request:
    paths: [install.sh, scripts/install-check.sh, scripts/install-check-mac.sh, plugin/**, cmd/**, internal/**, go.mod, go.sum, .github/workflows/install.yml]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request stops an older run (it would hold the few macOS
# runners), except on main, where every commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Whether a pull request touches the installer or its checks: only then does it run the
  # Macs too. Others (the program, the plugin) leave them to main, as macOS runners are few.
  # A change to install.sh that only showed on main went unseen for a week (14-nov).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      installer: ${{ steps.diff.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo installer=true >>"$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -Eq '^(install\.sh|scripts/install-check(-mac)?\.sh|\.github/workflows/install\.yml)$'; then
            echo installer=true >>"$GITHUB_OUTPUT"
          else
            echo installer=false >>"$GITHUB_OUTPUT"
          fi

  install:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    timeout-minutes: 10   # a stuck runner fails here instead of waiting six hours
    strategy:
      fail-fast: false
      # Two Macs, side by side. The Intel Mac and Ubuntu are jobs of their own: neither
      # waits for these.
      matrix:
        include:
          - os: macos-latest
            shell: /bin/zsh   # the default shell on a Mac
          - os: macos-latest  # most Macs have no Homebrew: the app comes from Anthropic's feed
            shell: /bin/zsh
            nobrew: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install from nothing and check
        env:
          SHELL: ${{ matrix.shell }}
          AB_CHECK_DESKTOP: "1"   # Homebrew or the feed on macOS, Anthropic's apt repository on Ubuntu
          AB_CHECK_NO_BREW: ${{ matrix.nobrew }}
        run: scripts/install-check.sh
      - name: What only a Mac can get wrong (PATH file, macOS version, Apple's git)
        if: runner.os == 'macOS'
        run: scripts/install-check-mac.sh

  install-linux:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install from nothing and check
        env:
          SHELL: /bin/bash
          AB_CHECK_DESKTOP: "1"   # Anthropic's apt repository on Ubuntu
        run: scripts/install-check.sh

  # Intel Macs (the darwin_amd64 build and the Intel app): on main, by hand, and in a pull
  # request that touches the installer, like the other Macs; not in every pull request.
  install-mac-intel:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    timeout-minutes: 10
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install from nothing and check
        env:
          SHELL: /bin/zsh
          AB_CHECK_DESKTOP: "1"
          AB_CHECK_NO_BREW: "1"
        run: scripts/install-check.sh
      - name: What only a Mac can get wrong (PATH file, macOS version, Apple's git)
        run: scripts/install-check-mac.sh
