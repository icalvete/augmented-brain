name: ci

# Each change runs once: in its pull request (forks included), and again on main when
# it lands. A branch with no pull request gets no CI: scripts/precheck.sh (run by the
# pre-push hook) tries it on your computer first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes an older run of this workflow moot, so it
# is stopped (cancel-in-progress) instead of holding the few macOS runners; a run on
# main is never stopped, so every commit of main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 10   # a stuck runner fails here instead of waiting six hours
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build every release target
        run: scripts/release-build.sh 0.0.0-ci /tmp/dist

  # What this version writes, the last two releases must still read: after an update,
  # open Claude sessions keep the old program, and other machines may not be updated.
  compat:
    timeout-minutes: 10   # a stuck runner fails here instead of waiting six hours
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Earlier releases read what this one writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go build -o /tmp/ab-new ./cmd/augmented-brain
          scripts/compat-check.sh /tmp/ab-new

  # What the program does when something it uses is missing (Claude Code, gh, git, the
  # network, Tailscale, systemd, a backup, a configuration that loads, write access to the
  # notes): it says so and leaves nothing half done. On the three systems people use.
  faults:
    timeout-minutes: 10   # a stuck runner fails here instead of waiting six hours
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Something missing, one at a time
        run: python -I scripts/faults-check.py

  # The panel in real browser engines: every page loads with no console error, fits a
  # phone's screen, and the things a person does there work. Chromium, and WebKit
  # (Safari's engine, the iPhone's).
  #
  # It runs inside Playwright's own image, which already holds the browsers and the 181
  # system packages WebKit needs. Installing those with apt on the runner (--with-deps)
  # hung four times on 9 November 2026: Azure's Ubuntu mirror sent the 114 MB at 100 to
  # 220 KB/s instead of the usual 28 MB/s, and the job ran out of its 10 minutes. The
  # image's tag and the pip package must be the same Playwright version: each version
  # expects its own browser builds.
  panel:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      # The container runs as root and the checkout belongs to the runner's user: without
      # this, git refuses the folder and go build fails to stamp the version.
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Playwright for Python (the browsers are in the image)
        run: python -m pip install --quiet --break-system-packages playwright==1.64.1
      - name: Every page, in Chromium and WebKit
        run: python -I scripts/panel-browser-check.py chromium webkit

  # What only a real Mac can tell, with no one at the screen: Gatekeeper with a program
  # downloaded by a browser, the Secrets page with the keychain locked, and the panel in
  # Safari itself (not only its engine).
  mac:
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Let a script drive Safari
        run: sudo safaridriver --enable
      - name: Gatekeeper, a locked keychain and Safari
        env:
          AB_MAC_CHECK_KEYCHAIN: '1'
        run: python3 -I scripts/mac-check.py

  # Remote access for real on macOS: a LaunchAgent loaded into launchd, with a claude
  # that only pretends (remote-check.py). Windows runs it in windows.yml.
  remote:
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: remote install, status, doctor and uninstall with launchd
        run: python3 -I scripts/remote-check.py

  privacy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # In a pull request, the branch's own last commit, not the merge commit GitHub makes
      # up to test it: that one carries the GitHub profile's name, and is never pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: No secrets in the repository
        run: scripts/privacy-check.sh --all
      # The maintainer's personal data, by keyed fingerprints (the denylist itself is not
      # in the repo). Without the key it says so and passes, as in a fork; a push to the
      # project itself must have it. Dependabot's pull requests get no secrets either (they
      # only change go.mod, go.sum and the workflows); main checks them again once merged.
      - name: No personal data in the repository
        env:
          AB_PRIVACY_KEY: ${{ secrets.AB_PRIVACY_KEY }}
          AB_PRIVACY_REQUIRED: ${{ github.repository == 'icalvete/augmented-brain' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        run: python3 -I scripts/privacy-hashed.py scan
      # The website's pages are generated from the guides' Markdown: a change to a guide
      # that forgot to regenerate them would publish the old text.
      - name: The website's pages match the guides
        run: |
          python3 scripts/build-guides.py >/dev/null
          git diff --exit-code -- docs || { echo 'run scripts/build-guides.py and commit what it writes'; exit 1; }
