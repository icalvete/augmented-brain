name: ci

on:
  push:            # any branch: a branch is how a change gets tried before main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build every release target
        run: scripts/release-build.sh 0.0.0-ci /tmp/dist

  # What this version writes, the last two releases must still read: after an update,
  # open Claude sessions keep the old program, and other machines may not be updated.
  compat:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Earlier releases read what this one writes
        run: |
          go build -o /tmp/ab-new ./cmd/augmented-brain
          scripts/compat-check.sh /tmp/ab-new

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets in the repository
        run: scripts/privacy-check.sh --all
