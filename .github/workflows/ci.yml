name: ci

on:
  push:            # any branch: a branch is how a change gets tried before main
  pull_request:

permissions:
  contents: read

# macOS runners are few, and a push to a pull request's branch starts several Mac jobs
# at once (ci on push and on pull_request, install's Mac rows): some waited so long
# they were cancelled. A newer push to the same branch or pull request makes an older
# run of this workflow moot, so it is stopped (cancel-in-progress) instead of holding
# runners; a run on main is never stopped, so every commit of main keeps its result.
# The group tells events apart, so a push never stops a pull_request run (or the
# other way round): every check still runs on the last commit. Nothing is skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build every release target
        run: scripts/release-build.sh 0.0.0-ci /tmp/dist

  # What this version writes, the last two releases must still read: after an update,
  # open Claude sessions keep the old program, and other machines may not be updated.
  compat:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Earlier releases read what this one writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go build -o /tmp/ab-new ./cmd/augmented-brain
          scripts/compat-check.sh /tmp/ab-new

  privacy:
    runs-on: ubuntu-latest
    steps:
      # In a pull request, the branch's own last commit, not the merge commit GitHub makes
      # up to test it: that one carries the GitHub profile's name, and is never pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: No secrets in the repository
        run: scripts/privacy-check.sh --all
      # The maintainer's personal data, by keyed fingerprints (the denylist itself is not
      # in the repo). Without the key it says so and passes, as in a fork; a push to the
      # project itself must have it.
      - name: No personal data in the repository
        env:
          AB_PRIVACY_KEY: ${{ secrets.AB_PRIVACY_KEY }}
          AB_PRIVACY_REQUIRED: ${{ github.event_name == 'push' && github.repository == 'icalvete/augmented-brain' }}
        run: python3 -I scripts/privacy-hashed.py scan
