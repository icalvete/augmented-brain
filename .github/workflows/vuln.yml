name: vuln

# Known vulnerabilities in what the program is built with: Go's own library (the
# toolchain line of go.mod) and every module. It runs with each change, like ci.yml, and
# also once a week, because a new advisory turns an unchanged program vulnerable.
# govulncheck fails only on what the code can actually reach, for each system the
# release is built for.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  vuln:
    timeout-minutes: 10   # a stuck runner fails here instead of waiting six hours
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The modules downloaded are the ones go.sum names, byte for byte.
      - name: Modules match go.sum
        run: go mod verify
      # Installed for the runner first: GOOS below only tells it which system to check.
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: No reachable known vulnerability (${{ matrix.goos }})
        env:
          GOOS: ${{ matrix.goos }}
        run: "$(go env GOPATH)/bin/govulncheck ./..."
