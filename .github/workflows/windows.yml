name: windows

# The installer and the tests on Windows, apart from ci.yml: once per change, in its
# pull request (every one: "test" is a required check, and a filtered-out workflow
# would leave it missing), and again on main when the change touches what they cover.
on:
  push:
    branches: [main]
    paths: [install.ps1, scripts/install-check.ps1, plugin/**, cmd/**, internal/**, go.mod, go.sum, .github/workflows/windows.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: a newer push to the same pull request stops an older run, except on
# main, where every commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      # Keep the files as they are in the repository: Git for Windows would otherwise
      # turn line endings into CRLF on checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      # No -race: on Windows it needs a C compiler the runner does not set up.
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o augmented-brain.exe ./cmd/augmented-brain
      - name: The program runs
        run: ./augmented-brain.exe version

  # The installer from nothing, hands-off, on a clean Windows: install-check.ps1.
  install:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install from nothing and check
        env:
          AB_CHECK_DESKTOP: "1"   # the desktop app too, with winget
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-check.ps1

  # Remote access for real: a task of the Task Scheduler, with a claude that only
  # pretends (remote-check.py).
  remote:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: remote install, status, doctor and uninstall with the Task Scheduler
        run: python -I scripts/remote-check.py
