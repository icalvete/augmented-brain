name: windows

# The installer and the tests on Windows, apart from ci.yml: in every pull request and
# on every commit to main, with no filter of paths. "test" is a required check, and a
# filtered-out workflow would leave it missing: in a pull request, and on main, where
# the release waits for it on the commit to publish (scripts/release-checks.sh). A
# version commit merged by rebase touches only VERSION and the changelog, and has no
# merge commit to borrow the pull request's result from.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: a newer push to the same pull request stops an older run, except on
# main, where every commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      # Keep the files as they are in the repository: Git for Windows would otherwise
      # turn line endings into CRLF on checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      # No -race: on Windows it needs a C compiler the runner does not set up.
      #
      # -count=1: no test cache. With it, once a test binary ends, go test stats every
      # file the tests opened or looked at, to key the cache; internal/hook's tests log
      # some 900,000 (each guard call resolves the configuration's paths), which on the
      # Windows runners took minutes, past the job's 10, and looked like a hang with no
      # process left (14-nov-2026, #228). A CI run starts with an empty cache anyway.
      # -timeout well below the job's 10 minutes, so a test that does hang fails with
      # every goroutine's stack instead of the job being cancelled with nothing to go on.
      - name: Test
        run: go test -count=1 -timeout 3m ./...
      - name: Build
        run: go build -o augmented-brain.exe ./cmd/augmented-brain
      - name: The program runs
        run: ./augmented-brain.exe version

  # The installer from nothing, hands-off, on a clean Windows: install-check.ps1.
  install:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install from nothing and check
        env:
          AB_CHECK_DESKTOP: "1"   # the desktop app too, with winget
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-check.ps1

  # Remote access for real: a task of the Task Scheduler, with a claude that only
  # pretends (remote-check.py).
  remote:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: remote install, status, doctor and uninstall with the Task Scheduler
        run: python -I scripts/remote-check.py
