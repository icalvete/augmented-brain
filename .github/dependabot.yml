# Dependabot opens a pull request when a module or a GitHub action has a newer version,
# once a week and grouped, so it is one pull request per kind, not one per module.
# Its pull requests get no repository secrets: the privacy job in ci.yml knows that.
# A version is proposed only once it is a week old (cooldown): a release that was
# hijacked is usually found and pulled within days, before it reaches this repository.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  # The Python tools that rebuild the logo (assets/brand). They never ship, but a
  # vulnerable pin there still shows as an alert and in the OpenSSF Scorecard.
  - package-ecosystem: pip
    directory: /assets/brand
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      brand:
        patterns: ['*']
