{{define "content"}}{{with .D}}
<h1>{{t "profile"}}</h1>
<p class="hint">{{tf "profile.hint" .Path}}</p>
<form method="post" action="{{$.Base}}/profile" class="stack box">
  {{template "fields" (fields $)}}
  <label>{{t "f.name"}} <input name="name" value="{{.P.Name}}" required maxlength="200"></label>
  <label>{{t "f.about"}} <textarea name="about" rows="6" maxlength="8000">{{.P.About}}</textarea></label>
  <label>{{t "f.style"}} <textarea name="work_style" rows="6" maxlength="8000">{{.P.WorkStyle}}</textarea></label>
  <p class="hint">{{t "profile.lines"}}</p>
  <h2>{{t "profile.assistant"}}</h2>
  <p class="hint">{{t "profile.assistant.hint"}}</p>
  <label>{{t "f.assistant"}} <input name="assistant" value="{{.P.Assistant}}" maxlength="80"></label>
  <label>{{t "f.personality"}} <textarea name="personality" rows="4" maxlength="2000">{{.P.Personality}}</textarea></label>
  {{if .Signature}}<p class="hint">{{t "profile.signature"}}</p>
  <pre class="signature">{{.P.Assistant}}
{{.Signature}}</pre>{{end}}
  <button type="submit">{{t "save"}}</button>
</form>
{{end}}{{end}}
