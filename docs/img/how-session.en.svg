<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="A session, step by step"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5A52"/></marker></defs><rect width="1000" height="320" rx="16" fill="#FFFFFF"/><rect x="20" y="20" width="960" height="84" rx="14" fill="#F2F3F5" stroke="#6E7781" stroke-width="1.5"/><text x="40" y="67" text-anchor="start" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2128">1 · You open Claude</text><rect x="340" y="34" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#3C7A5E" stroke-width="1.5"/><text x="480.0" y="60.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C2128">Session start hook</text><text x="480.0" y="77.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5A52">finds the space of the folder</text><line x1="300" y1="62" x2="338" y2="62" stroke="#4B5A52" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="620" y1="62" x2="658" y2="62" stroke="#4B5A52" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="660" y="34" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#143024" stroke-width="1.5"/><text x="810.0" y="60.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C2128">Claude knows</text><text x="810.0" y="77.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5A52">profile, rules, live tasks</text><rect x="20" y="120" width="960" height="84" rx="14" fill="#F2F3F5" stroke="#6E7781" stroke-width="1.5"/><text x="40" y="167" text-anchor="start" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2128">2 · You say “park it”</text><rect x="340" y="134" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#3C7A5E" stroke-width="1.5"/><text x="480.0" y="160.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C2128">task_park tool</text><text x="480.0" y="177.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5A52">writes the task file</text><line x1="300" y1="162" x2="338" y2="162" stroke="#4B5A52" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="620" y1="162" x2="658" y2="162" stroke="#4B5A52" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="660" y="134" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#143024" stroke-width="1.5"/><text x="810.0" y="160.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C2128">Next session</text><text x="810.0" y="177.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5A52">resumes it, with the next step</text><rect x="20" y="220" width="960" height="84" rx="14" fill="#F2F3F5" stroke="#6E7781" stroke-width="1.5"/><text x="40" y="267" text-anchor="start" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2128">3 · Claude runs a command</text><rect x="340" y="234" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#3C7A5E" stroke-width="1.5"/><text x="480.0" y="260.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C2128">Guard hook</text><text x="480.0" y="277.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5A52">reads the command first</text><line x1="300" y1="262" x2="338" y2="262" stroke="#4B5A52" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="620" y1="262" x2="658" y2="262" stroke="#4B5A52" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="660" y="246" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/><text x="707" y="267" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2E7D4F">go ahead</text><rect x="762" y="246" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#9A6B00" stroke-width="2"/><text x="809" y="267" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9A6B00">ask you</text><rect x="864" y="246" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#B3261E" stroke-width="2"/><text x="911" y="267" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B3261E">stop</text></svg>
