<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" role="img" aria-label="A session, step by step"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5A52"/></marker></defs><rect width="760" height="314" rx="16" fill="#FFFFFF"/><rect x="16.0" y="16.0" width="728.0" height="86.0" rx="14" fill="#F1F3F5" stroke="#5F6B75" stroke-width="1.5"/><text x="32.0" y="64.0" text-anchor="start" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1C2128">1 · You open Claude</text><rect x="276.0" y="30.0" width="204.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#3C7A5E" stroke-width="1.5"/><text x="378.0" y="56.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C2128">Start hook</text><text x="378.0" y="75.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5A52">finds your space</text><line x1="484.0" y1="59.0" x2="506.0" y2="59.0" stroke="#4B5A52" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="510.0" y="30.0" width="218.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#143024" stroke-width="1.5"/><text x="619.0" y="56.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C2128">Claude knows</text><text x="619.0" y="75.0" text-anchor="middle" font-family="'IBM Plex Sans', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5A52">profile, rules, tasks</text><rect x="16.0" y="114.0" width="728.0" height="86.0" rx="14" fill="#F1F3F5" stroke="#5F6B75" stroke-width="1.5"/><text x="32.0" y="162.0" text-anchor="start" font-family="'IBM Plex Sans', Inter, 